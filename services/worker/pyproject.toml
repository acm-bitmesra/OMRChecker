[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omr-checker-worker"
version = "0.1.0"
description = "Asynchronous processing workers for OMR Checker"
requires-python = ">=3.12"
dependencies = ["celery[redis]>=5.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
