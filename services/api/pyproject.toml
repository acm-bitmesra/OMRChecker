[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omr-checker-api"
version = "0.2.0"
description = "API for creating, scanning, reviewing, and evaluating OMR answer sheets"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
  "opencv-contrib-python-headless>=4.10",
  "numpy>=1.26",
  "pymupdf>=1.24",
  "reportlab>=4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
