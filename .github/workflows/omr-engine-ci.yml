name: OMR engine CI

on:
  push:
    branches: [main, "docs/**", "feat/**", "fix/**"]
  pull_request:

jobs:
  omr-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/omr-engine/pyproject.toml
      - name: Install package and test dependencies
        run: pip install -e ".[dev]"
        working-directory: packages/omr-engine
      - name: Run tests
        run: pytest
        working-directory: packages/omr-engine

  template-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: pip install -e . pytest
        working-directory: packages/template-engine
      - name: Run tests
        run: pytest
        working-directory: packages/template-engine
